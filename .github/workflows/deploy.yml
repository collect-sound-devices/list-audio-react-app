name: Deploy to Vercel

on:
  push:
    branches:
      - main
    tags:
      - 'Release-*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Get version from Git tags
        shell: pwsh
        id: get_version
        run: |
          # Get the latest Release tag
          $LATEST_TAG = git describe --tags --match "Release-*" --abbrev=0
          if (-not $LATEST_TAG) {
           Write-Output "No Release tag found. Using default version."
           "VERSION=1.0.0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
           exit 0
          }
          Write-Output "LATEST_TAG: $LATEST_TAG"
  
          # Extract version number from the tag (e.g., Release-1.0.1 -> 1.0.1)
          $VERSIONNUMBER = $LATEST_TAG -replace '^Release-', ''
          Write-Output "VERSIONNUMBER: $VERSIONNUMBER"
  
          # Get the distance since the latest tag
          $DISTANCE = git rev-list --count "$LATEST_TAG..HEAD"
          Write-Output "DISTANCE: $DISTANCE"
  
          # Append -SP<distance> if distance is greater than 0
          if ($DISTANCE -gt 0) {
           # Increment the patch number for a prerelease build
           $VERSIONPARTS = $VERSIONNUMBER -split '\.'
           $VERSIONPARTS[2] = [int]$VERSIONPARTS[2] + 1
           $VERSIONNUMBER = $VERSIONPARTS -join '.'
           Write-Output "VERSION CORRECTED, versionNumber: $VERSIONNUMBER"
          
           $VERSION = "$VERSIONNUMBER-rc.$DISTANCE"
          } else {
           $VERSION = $VERSIONNUMBER
          }
  
          $VERSION = 'v' + $VERSION
          Write-Output "Derived development version: $VERSION (base tag: $LATEST_TAG)"
          # Output the version
          "VERSION=$VERSION" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "Using version: $VERSION"    
          
          - name: Get latest check-in time from Git
          id: get_latest_commit_date
          run: |
            # Get the latest commit date in ISO 8601 format
            LATEST_COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%dT%H:%M:%S%z')
            echo "LATEST_COMMIT_DATE=$LATEST_COMMIT_DATE" >> $GITHUB_OUTPUT
            echo "Latest commit date: $LATEST_COMMIT_DATE"    

      - name: Pull, build and deploy to Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_CLIENT_VERSION: ${{ steps.get_version.outputs.VERSION }}
          NEXT_PUBLIC_CLIENT_LATEST_COMMIT_DATE: ${{ steps.get_latest_commit_date.outputs.LATEST_COMMIT_DATE }}
        run: |
          set -euo pipefail
          npm install -g vercel@latest
          vercel pull --yes --environment=production
          # vercel build loads .vercel/.env.production.local. The NEXT_PUBLIC_* values must be injected there.
          {
            echo "NEXT_PUBLIC_CLIENT_VERSION=$NEXT_PUBLIC_CLIENT_VERSION"
            echo "NEXT_PUBLIC_CLIENT_LATEST_COMMIT_DATE=$NEXT_PUBLIC_CLIENT_LATEST_COMMIT_DATE"
          } >> .vercel/.env.production.local
          vercel build --prod
          vercel deploy --prebuilt --prod

      - name: Create or update Release
        run: |
          VERS=${{ steps.get_version.outputs.VERSION }}
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          if gh release view "$VERS" > /dev/null 2>&1; then
            echo "Release $VERS already exists, updating..."
            gh release edit "$VERS" --title "AudioDeviceRepoClient $VERS" --notes "Release of Audio Device Repository Client $VERS"
          else
            echo "Creating new release $VERS..."
            gh release create "$VERS" --title "AudioDeviceRepoClient $VERS" --notes "Release of Audio Device Repository Client $VERS"
          fi
